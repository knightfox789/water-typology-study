name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-security:
    name: static-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pre-publish security guard
        run: python3 scripts/prepublish_security_check.py
